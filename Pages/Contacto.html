  <main class="container my-5">
    <section class="contacto-section bg-white border border-3 border-pink rounded-4 p-4 shadow">

      <h2 class="text-center mb-5" style="font-family: 'Gugi', sans-serif; color: #FF4081;">
        Formulario
      </h2>

      <!--Form-->
      <div class="row g-5">
        <div class="col-md-6">
          <form>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre y apellido</label>
              <input type="text" class="form-control" id="nombre" placeholder="Tu nombre completo">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="xxxxxxxxxx@email.com">
            </div>

            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje</label>
              <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribí tu mensaje..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary px-4" style="background-color:#FF4081; border: none;">
              Enviar
            </button>
          </form>
        </div>

        <!--Inofrmación personal-->
        <div class="col-md-6 d-flex flex-column justify-content-center">
          <p class="mb-3"><strong>Email:</strong> contacto@ginebraflux.art</p>
          <p class="mb-3"><strong>Ubicación:</strong> San Telmo, Buenos Aires, Argentina</p>
          <div class="mt-4">
            <p><strong>Redes sociales:</strong></p>
            <ul class="list-unstyled">
              <li><a href="https://instagram.com" target="_blank" class="link-success">Instagram</a></li>
              <li><a href="https://tiktok.com" target="_blank" class="link-success">TikTok</a></li>
              <li><a href="https://x.com" target="_blank" class="link-success">X</a></li>
            </ul>
          </div>
        </div>
      </div>

    </section>
